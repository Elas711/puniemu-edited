<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{SERVER_NAME}}</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fff7e6; color: #3b2a1a; }
  header { background: #e8590c; color: #fff; padding: 14px 16px; font-weight: bold; font-size: 18px; }
  main { padding: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h2 { margin: 0 0 8px; font-size: 16px; color: #e8590c; }
  a.btn { display: inline-block; background: #e8590c; color: #fff; padding: 10px 14px; border-radius: 20px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<header>{{SERVER_NAME}}</header>
<main>
  <div class="card">
    <h2>News</h2>
    <p>{{MOTD}}</p>
  </div>
  <div class="card">
    <h2>Events</h2>
    <p>Choose which events you want to play: open <b>Help</b> in the game menu and tap <b>Events &amp; Server</b>.</p>
  </div>
</main>
</body>
</html>
